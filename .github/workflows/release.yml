name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            archive_name: aeon-cut-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            archive_name: aeon-cut-windows-x86_64.zip
          - name: macOS Universal
            os: macos-latest
            archive_name: aeon-cut-macos-universal.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev libasound2-dev

      - name: Build binary (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/aeon-cut dist/
          cp README.md LICENSE dist/
          cp -r assets dist/
          cd dist && tar -czf ../${{ matrix.platform.archive_name }} * && cd ..

      - name: Build binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/aeon-cut.exe dist/
          cp README.md LICENSE dist/
          7z a ${{ matrix.platform.archive_name }} ./dist/*

      - name: Build binary (macOS Universal)
        if: matrix.platform.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin --locked
          cargo build --release --target x86_64-apple-darwin --locked
          mkdir -p dist
          lipo -create -output dist/aeon-cut \
            target/aarch64-apple-darwin/release/aeon-cut \
            target/x86_64-apple-darwin/release/aeon-cut
          cp README.md LICENSE dist/
          cd dist && zip -r ../${{ matrix.platform.archive_name }} * && cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.platform.archive_name }}
          generate_release_notes: true
